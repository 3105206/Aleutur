<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Eutur Perfumes — Perfumes Árabes y de Diseñador Originales</title>
<meta name="description" content="Perfumes originales en Uruguay: árabes de Armaf, Lattafa y Maison Alhambra, y de diseñador como Armani, Dior, Valentino y Chanel.">
<link rel="icon" href="img/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
  <nav>
    <a class="marca" href="#">AL EUTUR</a>
    <div class="links">
      <a href="#hombre" onclick="irA('hombre')">Hombre</a>
      <a href="#mujer" onclick="irA('mujer')">Mujer</a>
      <a href="#decants" onclick="irA('decants')">Decants</a>
    </div>
    <div class="iconos">
      <button class="ico" onclick="abrirBuscador()" aria-label="Buscar perfume"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></button>
      <button class="ico carro" id="cartFab" onclick="abrirCarrito()" aria-label="Ver carrito"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1.2 12.2a1 1 0 0 1-1 .8H8.2a1 1 0 0 1-1-.8L6 7z"/><path d="M9 7V6a3 3 0 0 1 6 0v1"/></svg><span class="cart-count" id="cartCount">0</span></button>
    </div>
  </nav>
</header>

<section class="hero">
  <div class="kicker">Perfumes originales · Uruguay</div>
  <h1>Al Eutur</h1>
  <p>Árabes y de diseñador. Lujo y larga duración, a precios únicos.</p>
  <button class="hero-buscar" onclick="abrirBuscador()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg><span>Buscá por nombre, marca o inspiración</span></button>
  <!-- Fila de frascos en movimiento: se arma en js/app.js con la lista CARRUSEL -->
  <div class="vitrina" aria-label="Algunos de nuestros perfumes">
    <div class="vitrina-pista" id="vitrina"></div>
  </div>
</section>

<main class="tienda" id="tienda">
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="hombre" onclick="setTab('hombre')">Hombre</button>
    <button class="tab" data-tab="mujer" onclick="setTab('mujer')">Mujer</button>
    <button class="tab" data-tab="decants" onclick="setTab('decants')">Decants</button>
  </div>

  <div class="subtabs" id="subtabs">
    <button class="sub" data-sub="todos" onclick="setSub('todos')">Todos</button>
    <button class="sub" data-sub="disenador" onclick="setSub('disenador')">Diseñador</button>
    <button class="sub" data-sub="arabe" onclick="setSub('arabe')">Árabes</button>
  </div>

  <div class="grid" id="grid"></div>

  <div id="decantsBox" hidden>
    <p class="dec-nota">5 ml del mismo frasco original, en atomizador de vidrio. Rinde 80–90 disparos.</p>
    <div class="grid" id="decGrid"></div>
    <h3 class="titulo-chico">Combos de 3 decants</h3>
    <div class="combos" id="comboGrid"></div>
  </div>
</main>

<footer>
  <div class="foot-marca">AL EUTUR PERFUMES</div>
  <div class="foot-links">
    <a href="https://wa.me/59891700666" target="_blank">WhatsApp</a>
    <a href="https://instagram.com/aleutur_perfumeria" target="_blank">Instagram</a>
  </div>
</footer>

<a class="wa-fab" href="https://wa.me/59891700666?text=Hola%20Al%20Eutur%20Perfumes%20%F0%9F%8C%99" target="_blank" aria-label="Escribinos por WhatsApp"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg></a>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Buscador -->
<div class="buscador" id="buscador" onclick="if(event.target===this)cerrarBuscador()">
  <div class="bus-box" role="dialog" aria-label="Buscar perfume">
    <div class="bus-barra">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="busInput" type="text" enterkeyhint="search" placeholder="Ej: Sauvage, Lattafa, Aventus, vainilla…" autocomplete="off" oninput="buscar(this.value)">
      <button class="bus-cerrar" onclick="cerrarBuscador()" aria-label="Cerrar">✕</button>
    </div>
    <div class="bus-res" id="busRes"></div>
  </div>
</div>

<!-- Carrito -->
<div class="cart-panel" id="cartPanel" onclick="if(event.target===this)cerrarCarrito()">
  <aside class="cart-box" role="dialog" aria-label="Carrito">
    <div class="cart-head">
      <h3>Tu pedido</h3>
      <button class="cart-close" onclick="cerrarCarrito()" aria-label="Cerrar">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot" id="cartFoot">
      <div class="cart-total"><span>Total</span><strong id="cartTotal">$ 0</strong></div>
      <p class="cart-nota" id="cartNota"></p>
      <button class="cart-go" onclick="finalizarPedido()">Finalizar pedido por WhatsApp</button>
      <button class="cart-clear" onclick="vaciarCarrito()">Vaciar carrito</button>
    </div>
  </aside>
</div>

<!-- Los perfumes se cargan desde datos/perfumes.js y datos/decants.js -->
<script src="datos/perfumes.js"></script>
<script src="datos/decants.js"></script>
<script src="js/app.js"></script>
</body>
</html>
